name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ProtectedApp.sln
      - name: Build
        run: dotnet build ProtectedApp.sln -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test ProtectedApp.Guardian.Tests/ProtectedApp.Guardian.Tests.csproj -c Release --no-restore --nologo; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; dotnet test ProtectedApp.Vault.Tests/ProtectedApp.Vault.Tests.csproj -c Release --no-restore --nologo
      - name: Dependency audit
        run: ./Scripts/Test-OpenSourceRelease.ps1
      - name: Validate development installer (not for public distribution)
        run: ./Build-Installer.ps1 -AllowUnsignedDevelopmentBuild
