name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Restore
        run: dotnet restore ProtectedApp.sln
      - name: Build for analysis
        run: dotnet build ProtectedApp.sln -c Release --no-restore -warnaserror
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
