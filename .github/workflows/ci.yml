name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ProtectedApp.sln
      - name: Build
        run: dotnet build ProtectedApp.sln -c Release --no-restore -warnaserror
      - name: Test
        run: dotnet test ProtectedApp.Guardian.Tests/ProtectedApp.Guardian.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; dotnet test ProtectedApp.Vault.Tests/ProtectedApp.Vault.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo
      - name: Dependency audit
        run: ./Scripts/Test-OpenSourceRelease.ps1
      - name: Repository safety audit
        run: ./Scripts/Test-RepositorySafety.ps1
      # Building an installer launches unpackaged WinUI probes. That validation
      # runs in the tag-only release-candidate workflow, where the artifact is
      # actually produced and attested. Keeping it out of ordinary PR/push CI
      # avoids depending on an interactive desktop in ephemeral hosted runners.
